name: Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rafifmsn/alveo
  PACKAGE: alveo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, bcmath, xml, curl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Run Pint style check
        run: ./vendor/bin/pint --test

      - name: Run automated test suite
        run: php artisan test

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          SIZE_BYTES=$(docker buildx imagetools inspect "${{ env.IMAGE }}:latest" --raw | jq '[.manifests[]?.size // 0, .config.size // 0, (.layers[]?.size // 0)] | add')
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES:-0} / 1048576}")
          echo "### Image Size (${{ env.PACKAGE }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compressed manifest size: ${SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old versions (keep newest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDS=$(gh api --paginate "/user/packages/container/${{ env.PACKAGE }}/versions" \
            --jq 'sort_by(.created_at) | reverse | .[3:][].id' 2>/dev/null || true)
          for id in $IDS; do
            gh api -X DELETE "/user/packages/container/${{ env.PACKAGE }}/versions/${id}" || true
          done
